name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run; pushes to dev and main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lists the workflows to check: only those a PR or push changed. Changes to shared code, this
  # file or the release workflow check every workflow. Docs-only changes check none.
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.pick.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=$(for d in workflows/*/; do [ -f "$d/package.json" ] && basename "$d"; done)
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            picked=$all # new branch or force-push: no usable base
          else
            changed=$(git diff --name-only "$BASE" HEAD)
            if echo "$changed" | grep -qE '^(shared/|\.github/workflows/)'; then
              picked=$all
            else
              picked=$(echo "$changed" | sed -nE 's#^workflows/([^/]+)/.*#\1#p' | sort -u |
                while read -r w; do [ -f "workflows/$w/package.json" ] && echo "$w"; done)
            fi
          fi
          json=$(printf '%s\n' $picked | jq -Rnc '[inputs | select(length > 0)]')
          echo "Checking: $json"
          echo "workflows=$json" >> "$GITHUB_OUTPUT"

  check:
    name: Check ${{ matrix.workflow }}
    needs: changes
    if: needs.changes.outputs.workflows != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        workflow: ${{ fromJSON(needs.changes.outputs.workflows) }}
    defaults:
      run:
        working-directory: workflows/${{ matrix.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          alfred_workflow_cache: ${{ runner.temp }}/alfred-cache
          alfred_workflow_data: ${{ runner.temp }}/alfred-data
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workflow }}
          path: workflows/${{ matrix.workflow }}/dist/*.alfredworkflow
          if-no-files-found: error
