name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
    tags: ["v*"]

permissions:
  contents: write # attach the .alfredworkflow to releases

jobs:
  check:
    # macOS: the build uses plutil to write info.plist.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: Bitwarden.alfredworkflow
          path: dist/Bitwarden.alfredworkflow
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Bitwarden.alfredworkflow
          generate_release_notes: true
