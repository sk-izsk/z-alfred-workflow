name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.workflow }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workflow: z-bitwarden
            artifact: Bitwarden.alfredworkflow
          - workflow: z-vscode
            artifact: VS Code.alfredworkflow
          - workflow: z-github
            artifact: GitHub.alfredworkflow
          - workflow: z-speedtest
            artifact: Speed Test.alfredworkflow
          - workflow: z-kill-process
            artifact: Kill Process.alfredworkflow
          - workflow: z-brew
            artifact: Brew.alfredworkflow
          - workflow: z-cald
            artifact: Calendar.alfredworkflow
    defaults:
      run:
        working-directory: workflows/${{ matrix.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          alfred_workflow_cache: ${{ runner.temp }}/alfred-cache
          alfred_workflow_data: ${{ runner.temp }}/alfred-data
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.workflow }}
          path: workflows/${{ matrix.workflow }}/dist/${{ matrix.artifact }}
          if-no-files-found: error
