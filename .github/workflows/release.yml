name: Release workflow

on:
  push:
    tags: ["z-bitwarden/v*", "z-vscode/v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Select workflow and validate version
        id: project
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            z-bitwarden/v*) workflow=z-bitwarden; artifact=Bitwarden.alfredworkflow ;;
            z-vscode/v*) workflow=z-vscode; artifact='VS Code.alfredworkflow' ;;
            *) echo 'Unknown workflow tag' >&2; exit 1 ;;
          esac
          version=$(cd "workflows/$workflow" && bun -p "require('./package.json').version")
          test "$RELEASE_TAG" = "$workflow/v$version"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
        working-directory: workflows/${{ steps.project.outputs.workflow }}
      - run: bun run check
        env:
          alfred_workflow_cache: ${{ runner.temp }}/alfred-cache
          alfred_workflow_data: ${{ runner.temp }}/alfred-data
        working-directory: workflows/${{ steps.project.outputs.workflow }}
      - run: bun run package
        working-directory: workflows/${{ steps.project.outputs.workflow }}
      - uses: softprops/action-gh-release@v2
        with:
          files: workflows/${{ steps.project.outputs.workflow }}/dist/${{ steps.project.outputs.artifact }}
          fail_on_unmatched_files: true
          generate_release_notes: true
